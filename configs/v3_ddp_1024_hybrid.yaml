# V3 DDP multi-GPU config (bf16 only, no FP8)
#
# For 4x 3090 or similar multi-GPU DDP setup.
# Native 1024x1024 tiled training with global context.

model:
  patch_size: 8
  embed_dims: [128, 256, 384, 512]
  depths: [2, 2, 6, 2]
  num_heads: [4, 8, 12, 16]
  window_sizes: [8, 8, 4, 4]
  memory_tokens: 64
  temporal_window: 5
  drop_path_rate: 0.1
  gradient_checkpointing: true
  decoder_out_dim: 256

  # V3 features
  use_green_priors: true
  use_coordinate_channels: true
  use_unknown_band: true
  guidance_presence_flag: true
  green_prior_dropout: 0.50
  coarse_alpha_drop_prob: 0.20
  predict_fg: true
  predict_uncertainty: true
  predict_spill_mask: true
  predict_quality_eval: true
  fg_representation: premul

  # Global context
  global_context_dim: 256
  global_context_layers: 4
  global_context_heads: 8
  global_context_tokens: 64

  # Reference memory
  use_reference_memory: true
  reference_tokens_per_frame: 32
  num_reference_frames: 2
  reference_dropout: 0.25

  # Native refiner
  use_native_refiner: true
  native_refiner_blocks: 3
  native_refiner_hidden: 64
  native_refiner_max_alpha_delta: 0.05
  native_refiner_max_fg_delta: 0.05
  native_refiner_max_spill_delta: 0.25

data:
  dataset_root: "CorridorKeyDataset"
  batch_size_per_gpu: 1
  clip_len_min: 4
  clip_len_max: 8
  fixed_crop_size: 1024
  fg_representation: premul
  device_augment: true
  decode_full_frame: true
  emit_global_context: true
  global_context_long_side: 512
  host_dtype: bf16
  num_workers: 4
  pin_memory: true
  horizontal_flip_p: 0.5
  background_replace_p: 0.3
  spill_augment_p: 0.4
  green_foreground_prob: 0.25
  green_foreground_strength_min: 0.25
  green_foreground_strength_max: 0.75
  green_foreground_alpha_thresh: 0.70
  coarse_alpha_drop_prob: 0.20
  hint_degrade_enabled: true
  hint_degrade_clean_prob: 0.25
  hint_degrade_mild_prob: 0.50

train:
  epochs: 40
  lr: 2.0e-4
  weight_decay: 0.01
  warmup_steps: 5000
  min_lr_ratio: 0.1
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  compile: true
  compile_dynamic: true
  fused_adamw: true
  cuda_warmup: true
  cuda_prefetch: true
  log_interval: 20
  save_interval: 1
  inference_mode: hybrid
  temporal_batch_size: 4
  debug_console: true
  grad_accum_steps: 1

  parameter_groups:
    enabled: true
    backbone_lr_prefixes: ""
    backbone_lr_ratio: 1.0

loss:
  alpha_l1: 1.0
  alpha_laplacian: 1.0
  fg_l1: 1.0
  comp_l1: 1.0
  alpha_band_l1: 0.5
  alpha_band_laplacian: 0.5
  temporal_alpha_gradient: 0.3
  temporal_fg_gradient: 0.15
  comp_random_bg: 0.3
  spill_l1: 0.5
  spill_transition_only: true
  spill_transition_low: 0.02
  spill_transition_high: 0.98
  spill_exclude_opaque_fg: true
  spill_opaque_alpha_thresh: 0.90
  green_fg_alpha: 2.0
  green_fg_color: 1.0
  green_fg_alpha_thresh: 0.75
  green_fg_margin: 0.08
  green_fg_min_saturation: 0.10
  uncertainty: 0.1
  coarse_alpha_l1: 0.5
  coarse_fg_l1: 0.3
  native_alpha_delta_reg: 0.05
  native_fg_delta_reg: 0.05
  quality_eval: 0.1

ddp:
  backend: nccl
  find_unused_parameters: false
  static_graph: true
  sync_bn: false
  bucket_cap_mb: 128
  grad_compression: bf16
  timeout_minutes: 30
